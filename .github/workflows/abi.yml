name: odi-abi
on: [push, pull_request]

jobs:
  abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler frontend
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ make
      - name: Run native C/C++ and freestanding architecture checks
        run: make check
